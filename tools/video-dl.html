<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>影片下載器</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0b0f1a;
  --bg-card: #111827;
  --bg-card-hover: #1a2236;
  --bg-input: #0d1526;
  --border: #1e2d45;
  --border-focus: #3b82f6;
  --accent: #3b82f6;
  --accent-dim: #1d4ed8;
  --accent-hover: #60a5fa;
  --text: #e2e8f0;
  --text-dim: #94a3b8;
  --text-muted: #4b5e78;
  --tag-bg: #1e3a5f;
  --tag-text: #93c5fd;
  --success: #10b981;
  --success-bg: #052e16;
  --error: #f87171;
  --error-bg: #2d0a0a;
  --warn-bg: #1c1407;
  --warn-text: #fbbf24;
  --warn-border: #92400e;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans TC', sans-serif;
  min-height: 100vh;
  line-height: 1.6;
}

header {
  border-bottom: 1px solid var(--border);
  padding: 1.2rem clamp(1rem, 5vw, 4rem);
  display: flex;
  align-items: center;
  gap: 1rem;
}

.vd-back {
  font-family: 'Space Mono', monospace;
  font-size: 0.8rem;
  color: var(--text-dim);
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 0.4rem;
  transition: color 0.15s;
}
.vd-back:hover { color: var(--accent); }

.vd-header-sep { color: var(--text-muted); }

.vd-title-h {
  font-family: 'Space Mono', monospace;
  font-size: 0.9rem;
  color: var(--accent);
}

main {
  max-width: 720px;
  margin: 0 auto;
  padding: clamp(2rem, 5vw, 3.5rem) clamp(1rem, 5vw, 2rem);
}

h1 {
  font-size: clamp(1.3rem, 3vw, 1.7rem);
  font-weight: 700;
  margin-bottom: 0.4rem;
}

.vd-subtitle {
  color: var(--text-dim);
  font-size: 0.9rem;
  margin-bottom: 2rem;
}

.vd-platform-badges {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
  margin-bottom: 2rem;
}

.vd-badge {
  font-family: 'Space Mono', monospace;
  font-size: 0.68rem;
  padding: 0.2rem 0.55rem;
  border-radius: 4px;
  border: 1px solid;
}
.vd-badge.supported { background: #0f2a1a; border-color: #166534; color: #4ade80; }
.vd-badge.unsupported { background: #1f1108; border-color: #92400e; color: #d97706; }

.vd-form {
  display: flex;
  flex-direction: column;
  gap: 1rem;
  margin-bottom: 1.5rem;
}

.vd-input-wrap {
  position: relative;
  display: flex;
  align-items: center;
}

.vd-url-input {
  width: 100%;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-family: 'Space Mono', monospace;
  font-size: 0.85rem;
  padding: 0.8rem 3rem 0.8rem 1rem;
  outline: none;
  transition: border-color 0.15s;
}
.vd-url-input:focus { border-color: var(--border-focus); }
.vd-url-input::placeholder { color: var(--text-muted); }

.vd-clear-btn {
  position: absolute;
  right: 0.7rem;
  background: none;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 1rem;
  padding: 0.2rem;
  line-height: 1;
  transition: color 0.15s;
  display: none;
}
.vd-clear-btn:hover { color: var(--text); }
.vd-clear-btn.visible { display: block; }

.vd-options-row {
  display: flex;
  gap: 0.8rem;
  flex-wrap: wrap;
  align-items: center;
}

.vd-select {
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-family: 'Space Mono', monospace;
  font-size: 0.78rem;
  padding: 0.45rem 0.7rem;
  outline: none;
  cursor: pointer;
  transition: border-color 0.15s;
}
.vd-select:focus { border-color: var(--border-focus); }

.vd-options-label {
  font-family: 'Space Mono', monospace;
  font-size: 0.75rem;
  color: var(--text-dim);
}

.vd-submit-btn {
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 8px;
  font-family: 'Noto Sans TC', sans-serif;
  font-size: 1rem;
  font-weight: 700;
  padding: 0.75rem 1.5rem;
  cursor: pointer;
  transition: background 0.15s, transform 0.1s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  width: 100%;
}
.vd-submit-btn:hover:not(:disabled) { background: var(--accent-hover); }
.vd-submit-btn:active:not(:disabled) { transform: scale(0.98); }
.vd-submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

.vd-spinner {
  width: 16px; height: 16px;
  border: 2px solid rgba(255,255,255,0.3);
  border-top-color: #fff;
  border-radius: 50%;
  animation: vd-spin 0.7s linear infinite;
  display: none;
}
@keyframes vd-spin { to { transform: rotate(360deg); } }
.vd-spinner.active { display: block; }

/* Result area */
.vd-result { display: none; margin-top: 1.5rem; }
.vd-result.visible { display: block; }

.vd-result-box {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 1.4rem;
}
.vd-result-box.success { border-color: #166534; }
.vd-result-box.error { border-color: #7f1d1d; }

.vd-result-title {
  font-family: 'Space Mono', monospace;
  font-size: 0.72rem;
  color: var(--text-dim);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 1rem;
}

.vd-dl-btn {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  background: var(--success-bg);
  border: 1px solid #166534;
  border-radius: 7px;
  color: #4ade80;
  text-decoration: none;
  padding: 0.7rem 1rem;
  font-size: 0.9rem;
  font-weight: 500;
  margin-bottom: 0.6rem;
  transition: background 0.15s, border-color 0.15s;
  cursor: pointer;
  width: 100%;
  word-break: break-all;
}
.vd-dl-btn:hover { background: #064e2b; border-color: #22c55e; }

.vd-dl-btn-icon { font-size: 1.1rem; flex-shrink: 0; }
.vd-dl-btn-text { flex: 1; }
.vd-dl-btn-label {
  font-family: 'Space Mono', monospace;
  font-size: 0.7rem;
  color: #6ee7b7;
}

.vd-error-msg {
  color: var(--error);
  font-size: 0.9rem;
  display: flex;
  gap: 0.5rem;
  align-items: flex-start;
}

.vd-picker-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 0.6rem;
}

.vd-picker-item {
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: 7px;
  overflow: hidden;
  text-decoration: none;
  color: var(--text);
  transition: border-color 0.15s;
  display: block;
}
.vd-picker-item:hover { border-color: var(--accent); }
.vd-picker-item img {
  width: 100%;
  aspect-ratio: 16/9;
  object-fit: cover;
  display: block;
}
.vd-picker-item-label {
  font-family: 'Space Mono', monospace;
  font-size: 0.7rem;
  color: var(--tag-text);
  padding: 0.4rem 0.6rem;
  text-align: center;
}

/* Warning box for unsupported */
.vd-warn {
  background: var(--warn-bg);
  border: 1px solid var(--warn-border);
  border-radius: 8px;
  padding: 1rem 1.2rem;
  margin-top: 1.5rem;
  display: none;
}
.vd-warn.visible { display: block; }
.vd-warn-title {
  font-family: 'Space Mono', monospace;
  font-size: 0.75rem;
  color: var(--warn-text);
  margin-bottom: 0.5rem;
}
.vd-warn p { font-size: 0.875rem; color: var(--text-dim); margin-bottom: 0.4rem; }
.vd-warn a { color: var(--accent); }

.vd-notice {
  margin-top: 2.5rem;
  padding-top: 1.5rem;
  border-top: 1px solid var(--border);
  font-size: 0.8rem;
  color: var(--text-muted);
  font-family: 'Space Mono', monospace;
  line-height: 1.7;
}
.vd-notice a { color: var(--text-dim); }
</style>
</head>
<body>

<header>
  <a class="vd-back" href="../index.html">← 返回工具集</a>
  <span class="vd-header-sep">/</span>
  <span class="vd-title-h">video-dl</span>
</header>

<main>
  <h1>影片下載器</h1>
  <p class="vd-subtitle">貼上影片網址，自動取得下載連結</p>

  <div class="vd-platform-badges">
    <span class="vd-badge supported">✓ YouTube</span>
    <span class="vd-badge supported">✓ X / Twitter</span>
    <span class="vd-badge supported">✓ Bilibili</span>
    <span class="vd-badge supported">✓ Instagram</span>
    <span class="vd-badge supported">✓ TikTok</span>
    <span class="vd-badge supported">✓ Reddit</span>
    <span class="vd-badge unsupported">△ Facebook</span>
    <span class="vd-badge unsupported">△ Weibo</span>
  </div>

  <div class="vd-form">
    <div class="vd-input-wrap">
      <input
        class="vd-url-input"
        id="vd-url"
        type="url"
        placeholder="https://www.youtube.com/watch?v=..."
        autocomplete="off"
        spellcheck="false"
      />
      <button class="vd-clear-btn" id="vd-clear" title="清除">✕</button>
    </div>

    <div class="vd-options-row">
      <span class="vd-options-label">畫質：</span>
      <select class="vd-select" id="vd-quality">
        <option value="max">最高畫質</option>
        <option value="2160">4K</option>
        <option value="1440">1440p</option>
        <option value="1080" selected>1080p</option>
        <option value="720">720p</option>
        <option value="480">480p</option>
        <option value="360">360p</option>
      </select>
      <span class="vd-options-label">格式：</span>
      <select class="vd-select" id="vd-format">
        <option value="auto">自動</option>
        <option value="mp4">mp4</option>
        <option value="webm">webm</option>
      </select>
    </div>

    <button class="vd-submit-btn" id="vd-submit">
      <div class="vd-spinner" id="vd-spinner"></div>
      <span id="vd-submit-text">取得下載連結</span>
    </button>
  </div>

  <!-- Result -->
  <div class="vd-result" id="vd-result">
    <div class="vd-result-box" id="vd-result-box">
      <div class="vd-result-title" id="vd-result-title"></div>
      <div id="vd-result-content"></div>
    </div>
  </div>

  <!-- Unsupported platform warning -->
  <div class="vd-warn" id="vd-warn">
    <div class="vd-warn-title">⚠ 此平台不支援</div>
    <p id="vd-warn-msg"></p>
    <p>Facebook / Weibo 等平台受限於反爬機制，目前無公開 API 可用。</p>
    <p>替代方案：瀏覽器擴充 <a href="https://fdown.net" target="_blank" rel="noopener">fdown.net</a>（Facebook）、<a href="https://weibomiaopai.com" target="_blank" rel="noopener">微博苗拍下載</a>（Weibo）。</p>
  </div>

  <div class="vd-notice">
    下載服務由 <a href="https://cobalt.tools" target="_blank" rel="noopener">cobalt.tools</a> 提供（開源、免費、無廣告）。<br>
    本工具僅供私人使用，請勿下載受版權保護的內容。
  </div>
</main>

<script>
const COBALT_API = 'https://api.cobalt.tools/';

const urlInput = document.getElementById('vd-url');
const clearBtn = document.getElementById('vd-clear');
const submitBtn = document.getElementById('vd-submit');
const submitText = document.getElementById('vd-submit-text');
const spinner = document.getElementById('vd-spinner');
const qualitySelect = document.getElementById('vd-quality');
const formatSelect = document.getElementById('vd-format');
const resultEl = document.getElementById('vd-result');
const resultBox = document.getElementById('vd-result-box');
const resultTitle = document.getElementById('vd-result-title');
const resultContent = document.getElementById('vd-result-content');
const warnEl = document.getElementById('vd-warn');
const warnMsg = document.getElementById('vd-warn-msg');

const UNSUPPORTED = ['facebook.com', 'fb.watch', 'weibo.com', 'weibo.cn'];

urlInput.addEventListener('input', () => {
  clearBtn.classList.toggle('visible', urlInput.value.length > 0);
  hideResults();
});

clearBtn.addEventListener('click', () => {
  urlInput.value = '';
  clearBtn.classList.remove('visible');
  urlInput.focus();
  hideResults();
});

urlInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') submitBtn.click();
});

submitBtn.addEventListener('click', handleSubmit);

function hideResults() {
  resultEl.classList.remove('visible');
  warnEl.classList.remove('visible');
}

function setLoading(on) {
  submitBtn.disabled = on;
  spinner.classList.toggle('active', on);
  submitText.textContent = on ? '處理中…' : '取得下載連結';
}

function isUnsupported(url) {
  return UNSUPPORTED.some(d => url.includes(d));
}

async function handleSubmit() {
  const url = urlInput.value.trim();
  if (!url) {
    urlInput.focus();
    return;
  }

  hideResults();

  if (isUnsupported(url)) {
    const domain = UNSUPPORTED.find(d => url.includes(d)) || '此平台';
    warnMsg.textContent = `偵測到 ${domain}。`;
    warnEl.classList.add('visible');
    return;
  }

  setLoading(true);

  const body = { url };
  const quality = qualitySelect.value;
  const format = formatSelect.value;
  if (quality !== 'max') body.videoQuality = quality;
  if (format !== 'auto') body.downloadMode = format === 'mp4' ? 'auto' : 'mute';

  try {
    const res = await fetch(COBALT_API, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Accept': 'application/json',
      },
      body: JSON.stringify(body),
    });

    const data = await res.json();
    showResult(data);
  } catch (err) {
    showError('網路錯誤：無法連線到 cobalt.tools，請稍後再試。');
  } finally {
    setLoading(false);
  }
}

function showResult(data) {
  resultEl.classList.add('visible');

  if (data.status === 'redirect' || data.status === 'tunnel' || data.status === 'stream') {
    const dlUrl = data.url;
    resultBox.className = 'vd-result-box success';
    resultTitle.textContent = '下載連結已就緒';
    resultContent.innerHTML = renderDlBtn(dlUrl, '下載影片');

  } else if (data.status === 'picker') {
    resultBox.className = 'vd-result-box success';
    resultTitle.textContent = `選擇要下載的項目（共 ${data.picker.length} 個）`;
    if (data.audio) {
      resultContent.innerHTML = renderDlBtn(data.audio, '下載音訊（背景音樂）');
    } else {
      resultContent.innerHTML = '';
    }
    const grid = document.createElement('div');
    grid.className = 'vd-picker-grid';
    data.picker.forEach((item, i) => {
      const a = document.createElement('a');
      a.className = 'vd-picker-item';
      a.href = item.url;
      a.target = '_blank';
      a.rel = 'noopener';
      if (item.thumb) {
        const img = document.createElement('img');
        img.src = item.thumb;
        img.alt = `項目 ${i + 1}`;
        img.loading = 'lazy';
        a.appendChild(img);
      }
      const label = document.createElement('div');
      label.className = 'vd-picker-item-label';
      label.textContent = item.type === 'photo' ? `圖片 ${i + 1}` : `影片 ${i + 1}`;
      a.appendChild(label);
      grid.appendChild(a);
    });
    resultContent.appendChild(grid);

  } else if (data.status === 'error') {
    const code = data.error?.code || 'unknown';
    const msg = errorMessage(code);
    showError(msg);

  } else {
    showError('收到未知的回應格式，請嘗試其他連結。');
  }
}

function renderDlBtn(url, label) {
  return `<a class="vd-dl-btn" href="${url}" target="_blank" rel="noopener">
    <span class="vd-dl-btn-icon">⬇</span>
    <span class="vd-dl-btn-text">
      <div>${label}</div>
      <div class="vd-dl-btn-label">在新分頁開啟 → 右鍵另存</div>
    </span>
  </a>`;
}

function showError(msg) {
  resultEl.classList.add('visible');
  resultBox.className = 'vd-result-box error';
  resultTitle.textContent = '發生錯誤';
  resultContent.innerHTML = `<div class="vd-error-msg"><span>✕</span><span>${msg}</span></div>`;
}

function errorMessage(code) {
  const map = {
    'error.api.unreachable': '無法連線到下載服務，請稍後再試。',
    'error.api.link.invalid': '網址格式不正確，請確認後重試。',
    'error.api.link.unsupported': '此網址不支援，cobalt.tools 目前無法處理此平台或連結。',
    'error.api.fetch.empty': '找不到可下載的媒體，可能是私人或已刪除的內容。',
    'error.api.fetch.short': '連結解析失敗，請嘗試完整網址。',
    'error.api.fetch.fail': '無法取得影片資訊，可能需要登入或內容受限。',
    'error.api.youtube.login': 'YouTube 要求登入才能下載此影片（年齡限制或私人影片）。',
    'error.api.youtube.age': '此為年齡限制影片，無法自動下載。',
    'error.api.content.too_long': '影片時長超出限制。',
    'error.api.file.unavailable': '檔案暫時無法取得，請稍後再試。',
  };
  return map[code] || `下載失敗（${code}），請嘗試其他連結或稍後再試。`;
}
</script>
</body>
</html>
